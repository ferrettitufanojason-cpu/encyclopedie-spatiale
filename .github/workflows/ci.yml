name: CI

# À chaque push / pull request : syntaxe, construction complète du site à partir des données enregistrées (data/), puis tous les tests.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntaxe des scripts et du client
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs lib/*.mjs api/*.js tests/*.mjs src/scripts/*.js; do node --check "$f"; done
      - name: Construction du site
        run: npm run build
      - name: Tests (données, ISS, accessibilité)
        run: npm test
