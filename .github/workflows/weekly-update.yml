name: Mise à jour hebdomadaire des données

# Chaque lundi : relance TOUS les imports (NASA, JPL, SIMBAD, IMO…), construit le site et lance les tests.
# Si tout passe, les nouvelles données (dossier data/) sont enregistrées dans le dépôt : ce commit déclenche
# automatiquement le déploiement Vercel, qui se contente de construire le site à partir de ces données
# (aucun téléchargement pendant le déploiement : plus rapide, et une source en panne ne casse pas le site).
on:
  schedule:
    - cron: '17 4 * * 1'   # lundi 04:17 UTC
  workflow_dispatch: {}    # lancement manuel possible depuis l'onglet « Actions »

concurrency:
  group: weekly-update
  cancel-in-progress: false

permissions:
  contents: write          # pour enregistrer les nouvelles données dans le dépôt

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SSOD_TOKEN: ${{ secrets.SSOD_TOKEN }}        # jeton Système solaire OpenData (gratuit)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import des données (échoue si une source requise est indisponible)
        run: npm run import:all
      - name: Construction du site (contrôle)
        run: npm run build
      - name: Tests (cohérence des données, plausibilité physique, images, ISS, accessibilité)
        run: npm test
      - name: Rapport d'import
        if: always()
        run: |
          echo '### Rapport d import' >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/import-report.json ]; then node -e "const r=require('./data/import-report.json');console.log(r.steps.map(s=>(s.ok?'- ✅ ':'- ❌ ')+s.step+' ('+s.seconds+' s)').join('\n'))" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f public/data/meta.json ]; then node -e "const m=require('./public/data/meta.json');console.log('\n**'+m.total+' objets**')" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Enregistrement des nouvelles données (déclenche le déploiement Vercel)
        if: success()
        run: |
          git add data/
          if git diff --cached --quiet; then echo "Aucune donnée modifiée cette semaine."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Données : mise à jour hebdomadaire ($(date -u +%Y-%m-%d))"
          git push
